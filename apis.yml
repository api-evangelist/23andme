name: 23andMe
description: >-
  23andMe is a consumer genetics and biotechnology company founded in 2006 that sells
  saliva-based DNA test kits and returns ancestry composition, DNA relative matching,
  genetic health-predisposition and carrier-status reports, wellness and trait insights,
  and pharmacogenetic results directly to consumers, alongside a research arm that studies
  aggregated, consented genetic data. 23andMe historically published a scope-gated,
  OAuth 2.0 Personal Genome API at api.23andme.com, but closed third-party developer API
  access in September 2018; the company entered Chapter 11 bankruptcy in 2025 and its
  consumer web presence and assets have since shifted to the 23andme.org domain. No public,
  live developer API surface remains, though the company maintains a trust center and a
  security disclosure program.
