name: 23andMe
description: >-
  23andMe is a consumer genetics company founded in 2006 that sells saliva-based DNA test
  kits and returns ancestry composition across 4,500+ regions, DNA relative matching,
  FDA-cleared genetic health predisposition and carrier-status reports, pharmacogenetics,
  polygenic risk scores, wellness and trait insights, plus a Total Health tier adding exome
  sequencing, biannual blood testing and genetics-informed telehealth. It is now operated by
  the 23andMe Research Institute, a non-profit, following the company's 2025 Chapter 11
  bankruptcy; the canonical consumer domain migrated from 23andme.com to 23andme.org, which
  serves the company's llms.txt, trust center and shop. 23andMe published a scope-gated
  OAuth 2.0 Personal Genome API at api.23andme.com but closed general third-party developer
  access in September 2018. It still markets API and raw-data integration through the
  23andMe Marketplace as a partner arrangement, though no machine-readable contract, API
  reference, pricing or rate limits are published publicly, and the developer portal host
  answers a Cloudflare bot challenge to anonymous requests.
