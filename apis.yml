    Contract discovery completed against every 23andMe host and found no machine-readable
    API: the consumer surface migrated to www.23andme.org, whose 642-URL sitemap contains
    no developer page, and the legacy Personal Genome API host api.23andme.com answers a
    Cloudflare managed challenge on every path. What 23andMe does serve from its own hosts,
    and what was captured verbatim here, is an llms.txt, a live Marketplace developer page
    that gates API access behind marketplace@23andme.com, a nine-certification trust center,
    and a HackerOne bug bounty.
