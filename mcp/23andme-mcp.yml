third_party_note: >-
  Community MCP servers (e.g. gene_mcp) accept a user's exported 23andMe raw DNA file
  as a local upload alongside AncestryDNA, MyHeritage and VCF exports. They read a file
  format, not a 23andMe API, and 23andMe neither publishes nor endorses them. They are
  recorded here only so a later pass does not mistake one for a first-party server.
