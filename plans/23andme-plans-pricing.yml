x-divergence:
  finding: >-
    23andMe's own agent-facing llms.txt disagrees with its human-facing pricing pages.
  detail: >-
    https://www.23andme.org/llms.txt (fetched 2026-08-15, HTTP 200) advertises three
    products under the OLD naming — "Ancestry + Traits Service ($99)", "23andMe+
    Premium ($199, renews $69/yr)" and "23andMe+ Total Health ($499, renews $199/yr)".
    The live pricing pages fetched the same day publish FOUR products under NEW naming:
    Basic Ancestry $99, Premium Ancestry $149 (renews $69/yr), Premium Ancestry + Health
    $199 (renews $99/yr) and Premium Ancestry + Total Health $499 (renews $199/yr). The
    $149 tier is missing from llms.txt entirely, and llms.txt attaches the $69/yr renewal
    to the $199 product when the live page attaches $99/yr to it. An agent trusting
    llms.txt would quote a price list the company no longer sells.
