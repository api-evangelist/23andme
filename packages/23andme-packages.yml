generated: '2026-08-15'
method: searched
source: >-
  npm registry (registry.npmjs.org), PyPI (pypi.org/pypi/<name>/json), and the
  github.com/23andMe organization repository listing via api.github.com
note: >-
  23andMe publishes NO first-party API client SDK. The Personal Genome API it once
  wrapped was closed to general third-party developers in September 2018, and no
  replacement client library has been published to any registry since. No `SDKs`
  pointer is emitted in apis.yml for this reason — the packages below are real,
  first-party, currently-maintained open-source libraries, but none of them is a
  client for a 23andMe API, so crediting them as SDKs would assert an API client
  surface that does not exist.
sdk_count: 0
official_package_count: 3
packages:
- language: javascript
  registry: npm
  name: styledot
  url: https://www.npmjs.com/package/styledot
  install: npm install styledot
  official: true
  api_client: false
  kind: design-system
  version: 3.15.0
  published: '2026-05-06'
  repository: https://github.com/23andme-private/style
  note: >-
    23andMe Design System. First-party — the npm maintainer list includes the
    `23andme` org account alongside named 23andMe engineers. The backing repository
    (23andme-private/style) is private, so the component surface is not publicly
    documented; this is an internal design system published to npm, not a public
    embeddable component library, and no Components artifact is emitted for it.
